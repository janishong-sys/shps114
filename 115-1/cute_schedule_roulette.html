<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Schedule Roulette</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
            user-select: none; /* Prevents text highlighting during rapid clicking */
        }

        /* The custom spotlight effect */
        .spotlight {
            transform: scale(1.15) rotate(2deg) !important;
            background-color: #fef08a !important; /* Bright yellow */
            border-color: #eab308 !important; 
            box-shadow: 0 0 25px 10px rgba(234, 179, 8, 0.6) !important;
            z-index: 50;
            position: relative;
        }

        .schedule-cell {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hiding scrollbar for neatness but allowing horizontal scroll on mobile */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body id="mainBody">

    <div class="max-w-5xl w-full bg-white rounded-[3rem] shadow-2xl p-6 md:p-10 border-8 border-pink-100 relative overflow-hidden">
        
        <!-- Decorative corner blobs -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-blue-100 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-yellow-100 rounded-full mix-blend-multiply filter blur-xl opacity-70"></div>

        <div class="text-center relative z-10 mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-pink-400 mb-2 drop-shadow-sm">
                ✨ My Weekly Schedule ✨
            </h1>
            <p class="text-gray-500 font-bold mb-6">Click the button below to start the spotlight!</p>
            
            <button id="rouletteBtn" class="bg-yellow-400 hover:bg-yellow-300 text-yellow-900 font-black py-4 px-8 rounded-full shadow-[0_6px_0_#ca8a04] hover:shadow-[0_4px_0_#ca8a04] active:shadow-[0_0px_0_#ca8a04] transform active:translate-y-[6px] transition-all text-xl md:text-2xl ring-4 ring-yellow-200">
                🎲 Start Spotlight Roulette
            </button>
            <p id="stopHint" class="text-sm text-pink-500 font-bold mt-3 opacity-0 transition-opacity duration-300">
                (Tap anywhere on the screen to stop!)
            </p>
        </div>

        <div class="w-full overflow-x-auto no-scrollbar relative z-10 pb-4">
            <div class="min-w-[800px] grid grid-cols-6 gap-4 text-center items-stretch">
                
                <!-- Table Headers -->
                <div class="flex items-center justify-center p-4 bg-gray-100 rounded-2xl font-bold text-gray-500 border-4 border-transparent shadow-sm">Period</div>
                <div class="flex items-center justify-center p-4 bg-pink-100 rounded-2xl font-black text-pink-700 text-lg border-4 border-transparent shadow-sm">Monday</div>
                <div class="flex items-center justify-center p-4 bg-blue-100 rounded-2xl font-black text-blue-700 text-lg border-4 border-transparent shadow-sm">Tuesday</div>
                <div class="flex items-center justify-center p-4 bg-green-100 rounded-2xl font-black text-green-700 text-lg border-4 border-transparent shadow-sm">Wednesday</div>
                <div class="flex items-center justify-center p-4 bg-yellow-100 rounded-2xl font-black text-yellow-700 text-lg border-4 border-transparent shadow-sm">Thursday</div>
                <div class="flex items-center justify-center p-4 bg-purple-100 rounded-2xl font-black text-purple-700 text-lg border-4 border-transparent shadow-sm">Friday</div>

                <!-- Period 1 Label -->
                <div class="flex items-center justify-center p-4 bg-gray-50 rounded-2xl font-bold text-gray-500 border-4 border-transparent shadow-sm">Class 1</div>
                
                <!-- Mon P1 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🧮</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Math</span>
                </div>
                <!-- Tue P1 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🔬</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Science</span>
                </div>
                <!-- Wed P1 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🎵</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Music</span>
                </div>
                <!-- Thu P1 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">⚽</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">PE</span>
                </div>
                <!-- Fri P1 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🖌️</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Chinese</span>
                </div>

                <!-- Period 2 Label -->
                <div class="flex items-center justify-center p-4 bg-gray-50 rounded-2xl font-bold text-gray-500 border-4 border-transparent shadow-sm">Class 2</div>
                
                <!-- Mon P2 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🖌️</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Chinese</span>
                </div>
                <!-- Tue P2 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">📚</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">English</span>
                </div>
                <!-- Wed P2 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🎨</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Art</span>
                </div>
                <!-- Thu P2 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🌍</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Social St.</span>
                </div>
                <!-- Fri P2 -->
                <div class="roulette-target schedule-cell flex flex-col items-center justify-center p-6 bg-white rounded-2xl border-4 border-gray-100 shadow-md">
                    <span class="text-5xl mb-3 drop-shadow-sm">🧮</span>
                    <span class="font-black text-gray-700 text-xl tracking-wide">Math</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const rouletteBtn = document.getElementById('rouletteBtn');
        const stopHint = document.getElementById('stopHint');
        const cells = document.querySelectorAll('.roulette-target');
        
        // State variables
        let isSpinning = false;
        let intervalId = null;

        // Function to remove spotlight from all cells
        function clearAllHighlights() {
            cells.forEach(cell => {
                cell.classList.remove('spotlight');
            });
        }

        // Start the roulette rotation
        function startRoulette() {
            if (isSpinning) return;
            
            isSpinning = true;
            
            // Update UI for playing state
            rouletteBtn.innerHTML = '🛑 Stop Spotlight';
            rouletteBtn.classList.replace('bg-yellow-400', 'bg-red-400');
            rouletteBtn.classList.replace('hover:bg-yellow-300', 'hover:bg-red-300');
            rouletteBtn.classList.replace('text-yellow-900', 'text-red-950');
            rouletteBtn.classList.replace('ring-yellow-200', 'ring-red-200');
            rouletteBtn.classList.replace('shadow-[0_6px_0_#ca8a04]', 'shadow-[0_6px_0_#991b1b]');
            rouletteBtn.classList.replace('hover:shadow-[0_4px_0_#ca8a04]', 'hover:shadow-[0_4px_0_#991b1b]');
            rouletteBtn.classList.replace('active:shadow-[0_0px_0_#ca8a04]', 'active:shadow-[0_0px_0_#991b1b]');
            
            stopHint.classList.remove('opacity-0');
            stopHint.classList.add('opacity-100');

            // Rapidly jump highlight between random cells every 80ms
            intervalId = setInterval(() => {
                clearAllHighlights();
                const randomIndex = Math.floor(Math.random() * cells.length);
                cells[randomIndex].classList.add('spotlight');
            }, 80);
        }

        // Stop the roulette on current random cell
        function stopRoulette() {
            if (!isSpinning) return;

            clearInterval(intervalId);
            isSpinning = false;

            // Update UI back to ready state
            rouletteBtn.innerHTML = '🎲 Start Spotlight Roulette';
            rouletteBtn.classList.replace('bg-red-400', 'bg-yellow-400');
            rouletteBtn.classList.replace('hover:bg-red-300', 'hover:bg-yellow-300');
            rouletteBtn.classList.replace('text-red-950', 'text-yellow-900');
            rouletteBtn.classList.replace('ring-red-200', 'ring-yellow-200');
            rouletteBtn.classList.replace('shadow-[0_6px_0_#991b1b]', 'shadow-[0_6px_0_#ca8a04]');
            rouletteBtn.classList.replace('hover:shadow-[0_4px_0_#991b1b]', 'hover:shadow-[0_4px_0_#ca8a04]');
            rouletteBtn.classList.replace('active:shadow-[0_0px_0_#991b1b]', 'active:shadow-[0_0px_0_#ca8a04]');
            
            stopHint.classList.remove('opacity-100');
            stopHint.classList.add('opacity-0');
        }

        // Toggle handler for the main button
        rouletteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent the body click listener from firing immediately
            if (isSpinning) {
                stopRoulette();
            } else {
                startRoulette();
            }
        });

        // Add a global click listener to stop roulette by tapping anywhere on the screen
        document.body.addEventListener('click', () => {
            if (isSpinning) {
                stopRoulette();
            }
        });

    </script>
</body>
</html>
