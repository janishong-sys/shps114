<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What day is it/today?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f7fa;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }

        /* 圖片容器與提示效果 */
        .image-container {
            width: 250px;
            height: 180px;
            margin: 0 auto 20px auto;
            border: 3px dashed #4a90e2;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background-color: #f0f4f8;
            transition: transform 0.2s, border-color 0.2s;
        }

        .image-container:hover {
            transform: scale(1.02);
            border-color: #357abd;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: #4a90e2;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 問答文字區域 */
        .question-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            margin: 15px 0 5px 0;
        }

        .answer-box {
            font-size: 2.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0 25px 0;
        }

        .blank {
            color: #e74c3c;
            border-bottom: 3px solid #e74c3c;
            padding: 0 10px;
        }

        /* 按鈕樣式 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            font-size: 1.1rem;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-random {
            background-color: #4a90e2;
            color: white;
        }

        .btn-random:hover {
            background-color: #357abd;
        }

        .btn-answer {
            background-color: #2ecc71;
            color: white;
        }

        .btn-answer:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 頂端隨機圖片顯示區 -->
    <div class="image-container" id="imgContainer" onclick="getRandomImage()" title="點擊換一張圖片">
        <span class="placeholder-text" id="placeholder">點擊這裡顯示圖片</span>
        <img id="dayImage" src="" alt="Calendar Day" style="display: none;">
    </div>

    <!-- 文字問答區 -->
    <div class="question-box">What day is it/today?</div>
    <div class="answer-box" id="answerLine">It's <span class="blank">___________</span>.</div>

    <!-- 控制按鈕 -->
    <div class="btn-group">
        <button class="btn-random" onclick="getRandomImage()">隨機抽圖</button>
        <button class="btn-answer" onclick="showAnswer()">顯示答案</button>
    </div>
</div>

<script>
    // 圖片檔名與對應答案資料陣列
    const daysData = [
        { file: 'wb_p9_1.jpg', answer: 'Sunday' },
        { file: 'wb_p9_2.jpg', answer: 'Monday' },
        { file: 'wb_p9_3.jpg', answer: 'Tuesday' },
        { file: 'wb_p9_4.jpg', answer: 'Wednesday' },
        { file: 'wb_p9_5.jpg', answer: 'Thursday' },
        { file: 'wb_p9_6.jpg', answer: 'Friday' },
        { file: 'wb_p9_7.jpg', answer: 'Saturday' }
    ];

    let currentIndex = -1;

    // 隨機切換圖片
    function getRandomImage() {
        // 隨機選取索引，並避免連續抽到同一張
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * daysData.length);
        } while (randomIndex === currentIndex && daysData.length > 1);

        currentIndex = randomIndex;

        const imgElement = document.getElementById('dayImage');
        const placeholder = document.getElementById('placeholder');
        
        // 設定圖片路徑
        imgElement.src = daysData[currentIndex].file;
        imgElement.style.display = 'block';
        placeholder.style.display = 'none';

        // 重置答案為底線
        resetAnswer();
    }

    // 顯示正確答案
    function showAnswer() {
        if (currentIndex === -1) {
            alert('請先點擊上方區域或「隨機抽圖」按鈕！');
            return;
        }
        const answerLine = document.getElementById('answerLine');
        const currentAnswer = daysData[currentIndex].answer;
        answerLine.innerHTML = `It's <span style="color: #2ecc71;">${currentAnswer}</span>.`;
    }

    // 重置答案顯示
    function resetAnswer() {
        const answerLine = document.getElementById('answerLine');
        answerLine.innerHTML = `It's <span class="blank">___________</span>.`;
    }
</script>

</body>
</html>
