<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機圖片展示</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #image-container {
            margin-top: 20px;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border: 3px dashed #ccc;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: border-color 0.3s ease;
            overflow: hidden;
            padding: 10px;
        }
        #image-container:hover {
            border-color: #007bff;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            display: none; /* 初始隱藏，直到抽中圖片才顯示 */
            object-fit: contain;
        }
        #placeholder-text {
            color: #888;
            font-size: 18px;
            pointer-events: none;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <h1>請點擊按鈕或下方框框來隨機顯示圖片</h1>
    
    <button onclick="showRandomImage()">點我抽圖片</button>
    
    <div id="image-container" onclick="showRandomImage()">
        <img id="random-image" src="" alt="隨機圖片">
        <p id="placeholder-text">圖片將顯示於此 (可直接點擊)</p>
    </div>

    <script>
        // 建立一個包含所有圖片檔名的陣列 (請確保檔名與實際檔案完全一致，包含副檔名大小寫)
        const images = [
            "apple in box.jpg",
            "by 01.png",
            "on 01.png",
            "under.png",
            "wb_p28_1.jpg",
            "wb_p28_4.jpg",
            "wb_p28_5.jpg",
            "wb_p28_6.jpg",
            "wb_p28_7.jpg",
            "wb_p28_10.jpg",
            "wb_p28_11.jpg",
"wb_p28_12.jpg","wb_p30_3.jpg","wb_p30_4.jpg"

 
        ];

        function showRandomImage() {
            // 隨機產生一個 0 到 陣列長度減1 的索引值
            const randomIndex = Math.floor(Math.random() * images.length);
            
            // 取得 HTML 元素
            const imgElement = document.getElementById("random-image");
            const placeholder = document.getElementById("placeholder-text");

            // 更新圖片來源並調整顯示設定
            imgElement.src = images[randomIndex];
            imgElement.style.display = "block";
            placeholder.style.display = "none";
        }
    </script>

</body>
</html>
