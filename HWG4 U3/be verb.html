<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where...? 句型練習</title>
    <!-- 引入 Tailwind CSS 進行版面美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 加入平滑過渡動畫效果 */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        
        <!-- 頂部標題區 -->
        <div class="bg-indigo-600 text-white text-center py-4 px-6">
            <h1 class="text-2xl font-bold">英文句型練習</h1>
            <p class="text-indigo-200 text-sm mt-1">看圖與人稱，造出正確的問句與答句</p>
        </div>

        <div class="p-6 md:p-8">
            <!-- 圖片顯示區塊 -->
            <div class="mb-6 flex justify-center bg-gray-100 rounded-xl overflow-hidden border-2 border-gray-200 h-64 relative">
                <!-- 預設載入的圖片 -->
                <img id="roomImage" src="" alt="Room Image" class="object-contain w-full h-full p-2" 
                     onerror="this.onerror=null; document.getElementById('imageErrorMsg').classList.remove('hidden');">
                
                <!-- 圖片遺失時的錯誤提示畫面 -->
                <div id="imageErrorMsg" class="absolute inset-0 flex items-center justify-center bg-gray-100/90 hidden flex-col px-4 text-center">
                    <svg class="w-12 h-12 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-gray-500 text-sm mb-1 font-bold">找不到圖片檔案</span>
                    <span class="text-xs text-gray-500">請確認圖片 (wb_p21_1.jpg 等) 與此 HTML 檔案放在同一資料夾</span>
                </div>
            </div>

            <!-- 題目區：顯示問句 (be動詞一開始為空格) -->
            <div class="text-center mb-6">
                <p class="text-sm text-gray-500 font-semibold mb-1">Question (問句)</p>
                <p id="questionText" class="text-3xl font-extrabold text-indigo-700 fade-in min-h-[40px] tracking-wide"></p>
            </div>

            <!-- 答案顯示區 (預設隱藏) -->
            <div id="answerSection" class="hidden text-center bg-green-50 rounded-xl p-4 mb-6 border border-green-200 fade-in">
                <p class="text-sm text-green-600 font-semibold mb-1">Answer (答句)</p>
                <p id="answerText" class="text-2xl font-bold text-green-800"></p>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col gap-3">
                <!-- 顯示答案按鈕 -->
                <button id="btnShowAnswer" onclick="showAnswer()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md transform hover:-translate-y-0.5 text-lg">
                    顯示答案 👀
                </button>
                <!-- 下一題按鈕 (顯示答案後才會出現) -->
                <button id="btnNext" onclick="generateQuestion()" class="hidden w-full bg-white border-2 border-indigo-500 text-indigo-600 hover:bg-indigo-50 font-bold py-3 px-4 rounded-xl transition duration-200 shadow-sm text-lg">
                    下一題 ➡️
                </button>
            </div>
        </div>
    </div>

    <script>
        // 定義房間圖片與對應的英文單字 (依照您上傳的圖片檔名)
        const places = [
            { img: 'wb_p21_1.jpg', name: 'kitchen' },
            { img: 'wb_p21_2.jpg', name: 'bathroom' },
            { img: 'wb_p21_3.jpg', name: 'bedroom' },
            { img: 'wb_p21_4.jpg', name: 'dining room' },
            { img: 'wb_p21_5.jpg', name: 'living room' },
            { img: 'wb_p21_6.jpg', name: 'yard' }
        ];

        // 定義人稱、對應的 be 動詞，以及回答時的主詞代名詞
        const subjects = [
            { name: 'you', be: 'are', answerPronoun: 'I am' },
            { name: 'he', be: 'is', answerPronoun: 'He is' },
            { name: 'she', be: 'is', answerPronoun: 'She is' },
            { name: 'Amber', be: 'is', answerPronoun: 'She is' },
            { name: 'Grandpa', be: 'is', answerPronoun: 'He is' },
            { name: 'your sister', be: 'is', answerPronoun: 'She is' },
            { name: 'Teddy', be: 'is', answerPronoun: 'He is' },
            { name: 'Grandpa and Grandma', be: 'are', answerPronoun: 'They are' },
            { name: 'Dan', be: 'is', answerPronoun: 'He is' }
        ];

        let currentPlace = null;
        let currentSubject = null;

        // 隨機產生題目的函式
        function generateQuestion() {
            currentPlace = places[Math.floor(Math.random() * places.length)];
            currentSubject = subjects[Math.floor(Math.random() * subjects.length)];

            document.getElementById('imageErrorMsg').classList.add('hidden');

            // 1. 設定圖片
            document.getElementById('roomImage').src = currentPlace.img;
            
            // 2. 設定題目 (問句的 be 動詞以底線空格顯示)
            document.getElementById('questionText').textContent = `Where _____ ${currentSubject.name}?`;
            
            // 3. 預先準備好正確答案 (先隱藏)
            document.getElementById('answerText').textContent = `${currentSubject.answerPronoun} in the ${currentPlace.name}.`;

            // 重置文字動畫效果
            const qText = document.getElementById('questionText');
            qText.classList.remove('fade-in');
            void qText.offsetWidth; 
            qText.classList.add('fade-in');

            // 切換按鈕與答案區塊的顯示狀態
            document.getElementById('answerSection').classList.add('hidden');
            document.getElementById('btnShowAnswer').classList.remove('hidden');
            document.getElementById('btnNext').classList.add('hidden');
        }

        // 顯示答案的函式
        function showAnswer() {
            // 將問句的空格替換成正確的 be 動詞
            document.getElementById('questionText').textContent = `Where ${currentSubject.be} ${currentSubject.name}?`;

            // 顯示答句與「下一題」按鈕
            document.getElementById('answerSection').classList.remove('hidden');
            document.getElementById('btnShowAnswer').classList.add('hidden');
            document.getElementById('btnNext').classList.remove('hidden');
        }

        // 當網頁載入完成後，自動產生第一題
        window.onload = generateQuestion;
    </script>
</body>
</html>
